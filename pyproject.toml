[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-pool"
version = "0.2.0"
description = "An LLM client backed by ChatGPT subscription quota, with a rotating multi-account credential pool"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FantasySakura0515" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
codex-pool-import = "codex_pool.import_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_pool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
