[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tidepool"
version = "0.3.0"
description = "An LLM client backed by ChatGPT subscription quota, with a rotating multi-account credential pool"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "FantasySakura0515" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "codex", "chatgpt", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
tidepool-import = "tidepool.import_cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tidepool"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "SIM", "RET", "C4"]

[tool.ruff.lint.per-file-ignores]
# 測試裡的假物件刻意不接住例外，讓失敗直接冒出來。
"tests/*" = ["BLE001"]
